# M2 and M3 intentionally use the same corruption distribution so that the
# M2 -> M3 ablation isolates consistency losses rather than training data.
training_corruption:
  fixed_distribution:
    mild: 0.40
    medium: 0.40
    severe: 0.20

  mild:
    operation_count: [1, 1]
    jpeg: [90]
    gaussian_blur: [0.5]
    resize: [0.5]
    gaussian_noise: [0.02]
    center_crop: [0.8]
    color_jitter: [null]

  medium:
    operation_count: [1, 3]
    jpeg: [70, 50]
    gaussian_blur: [1.0]
    resize: [0.5]
    gaussian_noise: [0.05]
    center_crop: [0.8]
    color_jitter: [null]

  severe:
    operation_count: [2, 4]
    jpeg: [50, 30]
    gaussian_blur: [1.0, 2.0]
    resize: [0.25]
    gaussian_noise: [0.10]
    center_crop: [0.8]
    color_jitter: [null]
